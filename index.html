<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elif & Türkay | Bakımdayız 💖</title>
    <meta name="theme-color" content="#170817">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/like.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 20%, #2e1026 0%, #170817 50%, #0c040d 100%);
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 182, 217, 0.2);
        }
        .romantic-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative">

    <!-- Arka Plan Atmosferik Işıklar -->
    <div class="fixed top-[-10%] left-[-10%] w-[450px] h-[450px] bg-rose-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[450px] h-[450px] bg-pink-600/15 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Bakım Kartı -->
    <div class="glass-panel p-8 md:p-12 rounded-3xl max-w-md w-full text-center relative z-10 shadow-[0_0_50px_rgba(244,63,94,0.25)]">
        <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-tr from-rose-600 to-pink-500 rounded-2xl flex items-center justify-center text-4xl shadow-lg border border-white/25 animate-pulse">
            🛠️
        </div>
        
        <span class="px-3.5 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30 text-xs font-bold tracking-wider uppercase mb-3 inline-block">
            Elif & Türkay
        </span>
        
        <h1 class="romantic-font text-3xl md:text-4xl font-extrabold text-white mb-3">
            Sitemiz Şu An Bakımda
        </h1>
        
        <p class="text-pink-200/80 text-sm md:text-base leading-relaxed mb-6">
            Aşk sığınağımızı senin için daha da güzelleştiriyoruz sevgilim. Şu an giriş kapalı, çok yakında yeniden buradayız! 💖
        </p>

        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-black/40 border border-white/10 text-xs text-rose-300 font-semibold">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
            <span>Güncelleme devam ediyor...</span>
        </div>
    </div>

</body>
</html>
