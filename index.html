<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SONSUZA KADAR❤️ ELİİFİİİM ❤️</title>
    <style>
        /* CSS Kısmı: Premium Gece Mürdümü & Tozlu Gül Estetiği */
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c1a32 0%, #9f5069 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: white;
            overflow-x: hidden;
            background-attachment: fixed;
            /* Özel Kedi Patisi İmleci */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>🐾</text></svg>"), auto;
        }

        /* Tıklanabilir Alanlarda Kalp İmleci */
        button, input, .mektup-sec-btn, .surpriz-kutu, .galeri img, .mektup-kapat, .close, .nav-btn {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>❤️</text></svg>"), pointer !important;
        }

        /* Fare Arkasından Dökülen Kalplerin Stili */
        .cursor-iz {
            position: fixed;
            pointer-events: none;
            z-index: 999999;
            transform: translate(-50%, -50%);
            animation: kalpurucma 1s forwards linear;
        }

        @keyframes kalpurucma {
            0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) translateY(-40px) scale(0.4); opacity: 0; }
        }

        /* Kalp Yağmuru Animasyonu */
        .kalp {
            position: fixed;
            font-size: 30px;
            z-index: 99999;
            animation: yagis linear infinite;
            pointer-events: none;
        }

        @keyframes yagis {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.5; }
        }

        /* Giriş Ekranı Konteynırı */
        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            padding: 60px;
            border-radius: 40px;
            margin-top: 15vh;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .login-box h1 { font-size: 3rem; margin-bottom: 30px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }

        input#sifre {
            padding: 20px;
            width: 300px;
            border-radius: 25px;
            border: none;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #2c1a32;
        }

        button.giris-btn {
            padding: 20px 50px;
            border-radius: 25px;
            border: none;
            background: #5c2c44;
            color: white;
            font-size: 1.2rem;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button.giris-btn:hover { background: #7a3659; transform: scale(1.05); }

        /* Ana İçerik */
        #site-icerigi {
            display: none;
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
            text-align: center;
            z-index: 5;
            padding-bottom: 50px;
        }

        /* Birliktelik Sayacı Alanı */
        .sayac-kutusu {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .sayac-kutusu h2 { margin: 0 0 15px 0; font-size: 1.8rem; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .sayac-zaman {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 1.2rem;
        }

        .sayac-parca {
            background: rgba(92, 44, 68, 0.5);
            padding: 10px 20px;
            border-radius: 15px;
            min-width: 60px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .sayac-rakam { font-size: 2rem; font-weight: bold; block-size: auto; display: block; color: #ffebee; }

        /* Mektup Butonları Alanı */
        .mektup-butonlari-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .mektup-sec-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 22px;
            border-radius: 20px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Öne Çıkan Özel Buton */
        .mektup-sec-btn.ozel-vurgu {
            background: rgba(159, 80, 105, 0.4);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .mektup-sec-btn:hover {
            background: #5c2c44;
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* Fotoğraf Galerisi */
        .galeri {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .galeri img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid rgba(255,255,255,0.25);
            transition: 0.4s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .galeri img:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.8); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }

        /* Sürpriz Kutu Alanı */
        .surpriz-kutu-container {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .surpriz-kutu {
            font-size: 70px;
            transition: transform 0.3s ease;
            animation: titreme 2s infinite;
            display: inline-block;
        }

        .surpriz-kutu:hover { transform: scale(1.2) rotate(10deg); }

        @keyframes titreme {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .surpriz-yazi { font-size: 1.3rem; margin-top: 10px; font-weight: bold; color: #ffebee; }

        /* Ortak Mektup ve Pop-up Ekranı */
        #mektup-overlay {
            display: none;
            position: fixed;
            z-index: 200000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 6, 18, 0.97);
            align-items: center;
            justify-content: center;
        }

        .mektup-zarf {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 30px;
            max-width: 600px;
            width: 85%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            position: relative;
        }

        #mektup-metni {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #ffebee;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
        }

        .mektup-kapat {
            position: absolute;
            top: 15px; right: 25px;
            font-size: 40px;
            color: white;
        }

        /* Lightbox - Büyütme Alanı */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 100000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 70%;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #foto-notu {
            margin-top: 30px;
            font-size: 1.8rem;
            color: #ffcc80;
            font-weight: bold;
            max-width: 80%;
            padding: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .nav-btn { position: absolute; top: 50%; font-size: 80px; color: white; padding: 30px; user-select: none; }
        #prev { left: 5%; } #next { right: 5%; }
        .close { position: absolute; top: 30px; right: 50px; font-size: 60px; }
    </style>
</head>
<body>

    <button id="music-btn" style="display:none; position:fixed; top:20px; right:20px; padding:20px; border-radius:50%; border:none; z-index:9999; background: rgba(255,255,255,0.2); color:white;" onclick="muzikCal()">🎵</button>
    <audio id="audio" src="madrigal.mp3" loop></audio>

    <div class="login-box" id="login-ekrani">
        <h1>Elifime Özel❤️</h1>
        <input type="password" id="sifre" placeholder="Şifre buraya yaparsııınn...">
        <br>
        <button class="giris-btn" onclick="kontrolEt()">Giriş Yap</button>
    </div>

    <div id="site-icerigi">
        
        <!-- Birliktelik Sayacı -->
        <div class="sayac-kutusu">
            <h2>İyi Ki Karşıma Çıktın Sol Yanım... 🥰</h2>

                <div class="sayac-parca"><span class="sayac-rakam" id="sayac-gun">0</span>Gün</div>

                <span id="sevgimetre-yuzde" style="font-size: 3rem; font-weight: bold; color: #ffebee; display:block;">%0</span>
                <p id="sevgimetre-mesaj" style="font-size: 1.4rem; color: #ffcc80; margin-top: 15px; opacity: 0; transition: opacity 1s; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.3);"></p>
            </div>
        </div>

        <!-- Mektup Butonları Alanı -->
        <div class="mektup-butonlari-container">
            <button class="mektup-sec-btn ozel-vurgu" onclick="mektupYazdir('soylemekIstediklerim')">Sana Söylemek İstedikleriiim</button>
            <button class="mektup-sec-btn" onclick="mektupYazdir('ozledim')">Beni Özlediğinde Aç 🥺</button>
            <button class="mektup-sec-btn" onclick="mektupYazdir('gulmek')">Gülmek İstediğinde Aç </button>
            <button class="mektup-sec-btn" onclick="mektupYazdir('modun')">Modun Düştüğünde Aç 💖</button>
            <button class="mektup-sec-btn" onclick="mektupYazdir('uyku')">Uykun Gelmediğinde Aç 🌙</button>
        </div>

        <h1> Anılarımız 💌</h1>
        <div class="galeri" id="galeri-alani"></div>

        <!-- Gizli Sürpriz Kutu -->
        <div class="surpriz-kutu-container">
            <div class="surpriz-kutu" onclick="mektupYazdir('buyukSurpriz')">🤍</div>
            <div class="surpriz-yazi">Sadece çok özlediğinde tıkla... 🤫</div>
        </div>
    </div>

    <!-- Ortak Mektup Penceresi -->
    <div id="mektup-overlay">
        <span class="mektup-kapat" onclick="mektupKapat()">&times;</span>
        <div class="mektup-zarf">
            <div id="mektup-metni"></div>
        </div>
    </div>

    <div id="lightbox">
        <span class="close" onclick="kapat()">&times;</span>
        <div class="nav-btn" id="prev" onclick="degis(-1)">&#10094;</div>
        <img id="buyuk-resim" src="" alt="Anı">
        <div id="foto-notu"></div>
        <div class="nav-btn" id="next" onclick="degis(1)">&#10095;</div>
    </div>

    <script>
        const notlar = [
            "İlk datemiz, o günden bugüne her an içimdeki heyecanı tarif edemem... ❤️ ❤️", 
            "Ufoyla ısınan masum köylüler yani biz, dünyanın en tatlı halleriydi.", 
            "gülüşüne öldüğüm aşk kadın, okulda seni görebilmek için verdiğimiz çabaa.",
            "tek görünümlük fotoğraflarınla savaştığımız o güzel evren, hepsi bizim anımız.", 
            "Matracimizin yavaştan bize ısındığı,içimizi ısıtan gülüşün.", 
            "İlk dosya açışımız, belki o an farkında değildik ama bir ömürlük hikaye başlıyordu.",
            "yanında olamasam da gözlerinde kaybolduğum o en uzak ve en yakın anım.", 
            "Aşkımız ve o gün bize getirmeyi unuttuğun kalpli stickerlar, iyi ki unutmuşuz, bu sayede daha çok güldük.", 
            "ilk defa twin kombinleri denediğimiz evren.",
            "seninle ilk konserimiz, Madrigal çalarken dünyada sadece ikimizin varlığıyla baktığım o unutulmaz gece.", 
            "konser çıkışı kırmızı ışıkta derin konularrr, sanki trafik akmıyor da zaman bizim için duruyordu.",

            "yanındayken dünya duruyor, sanki evren sadece senin gülüşün etrafında dönüyor.", 
            "en masum bakışın, beni kendine bininci kez aşık ettiğin o eşsiz annn.", 
            "Birlikte ilk derbi galibiyetimiz, seninle paylaşınca her şeyin zaferi daha bir güzel.",
            "kalbimin sahibi ve ailesiii şimdilikk.", 
            "o gün seni çooook özlemiştim, yanına geldiğim an tüm dünyanın yorgunluğu bitti.", 
            "Bize ilk pasta yapışın,emeğinle o pastayı dünyanın en lezzetli şeyi yaptın.",
            "takip etmek diyince bizdir, yeter ki yanımda sen ol aşkım.", 
            "Elif ve Polat olduğumuz evren, her halimizle birbirimize bu kadar yakışmamız bir mucize.", 
            "seninle her yol çiçek, ama sen zaten o çiçeklerin en güzeli, en değerlisisin.",
            "gözlerin... İçlerinde kaybolup, sonsuza kadar orada kalmak istediğim tek yer.", 
            "seni ilk gördüğüm o gün, hayatımın geri kalanının sadece seninle olacağını anladığım an.", 
            "doğum gününde ne dilediğini meraktan çatladığımız gün, asıl dilek senin gibi birini hayatıma kattığı için benimkisiydi.",
            "sen benim şansımsın, iyi kii hayatımdasın, iyi kii benimsin.", 
            "Elif'im, her halinle öylesine güzelsin ki, kusurlar bile seninle kusursuzlaşıyor.", 
            "bizsiz yediğin yemeklerr yazıyoruzz...",
            "seninle zaman kavramı yok, ifşa olarak görsende gözlerindeki o ışıkla her anı anlamlandırıyoruz.", 
            "Senaya sempati kazandığımız anlar, bizi çektiği için değil, senin neşene tanıklık ettiği için sağ olsun ahahhahah.", 
            "dünyadaki en tatlı kız, evet sensin, yanılıyor muyum?",
            "her anın ayrı yeri var ama senin yerin hep kalbimin en başköşesinde, sonsuza kadar.", 
            "seninle yaşamaya, nefes almaya ve her yeni güne uyanmaya değer.", 
            "o güzel sabah kahvaltımız, sen karşımdayken çayın bile tadı bambaşka. kesinlikle yanaklarına odaklanmıyorum.",

            "kahvaltımızın hiç bitmemesi için zamana yalvardığımız o unutulmaz gün.",
            "peçetelerini bile sakladığım evren, benim için her zerren çok kiymetli.", 
            "yakışmak, benzemek ve bir olmak deyince akla gelen tek ikili biziz.",

            "kalbim seninle dolu, sarı kedim benim, hayatımın neşesi.", 
            "şimdilikk ennn güzel hatıra, ama daha güzellerini ekleyeceğiz.",

        // Mektup İçerikleri Dizisi
        const mektupMetinleri = {
            soylemekIstediklerim: "Selam sevgilim. Böyle bir şeyi tamamen içimden gelerek, seni biraz olsun gülümsetebilmek için yaptım. Umarım gördüğünde o dünyalar güzeli yüzünde kocaman bir tebessüm oluşmuştur.\n\nHer an, her saniye fiziken yanında olamıyorum ve bazen bunun canını sıktığını biliyorum. İşte tam olarak bu yüzden; ne zaman modun düşerse, ne zaman beni yanında hissetmek istersen girip mutlu ol diye bu dijital sığınağı hazırladım. Kilometreler ne derse desin; fiziken uzak olsak bile kalben, ruhen attığım her adımda, aldığım her nefeste senin yanındayım.\n\nBenim için bu dünyadaki en özel, en değerli ve en eşsiz varlık sensin. Aynı yoğun duyguları ve heyecanı kalbinde taşıdığını bilmek, senin de beni aynı aşkla sevdiğini hissetmek bu hayattaki en büyük gücüm. Aramıza, aşkımıza ve bize olan o güzel sevgin kalbinde hiç eksilmesin, hep ilk günkü gibi büyüsün tek isteğim bu.\n\nİleride birlikte yapacağımız, sayfalarını el ele dolduracağımız o gerçek anı defterimiz öncesi bu bizim için ufak bir pratik, aşkımızın tatlı bir fragmanı olsun istedim. Ama hepsinden öte, seni ne kadar çok sevdiğimi sana bir kez daha haykırmak içindi bu hamlem. Sen benim bu hayattaki en güzel şansım, sarı kedim, kalbimin en huzurlu köşesisin. İyi ki hayatımdasın Elif'im, sonsuza kadar sadece sen ve ben... ❤️",
            ozledim: "Sonsuza kadar sadece sen ve ben... ❤️\n\nYanında olamasam da kalbimin her atışı seninle sarı kedim. Beni özlediğin her an fotoğraflarımıza bak, ne kadar güzel güldüğümüzü ve birbirimize nasıl aşkla bağlandığımızı hatırla. Çok yakında yine yan yana olacağız bir tanem.",
            gulmek: "İyi ki varsın Elif'im, iyi ki hayatımdasııın ✨\n\nYüzünün o eşsiz gülüşünü canlandırmak için galerideki twin kombinli ifşalarımıza, beni şakadan dövdüğün anlara ya da ufoyla ısınmaya çalıştığımız o masum hallerimize bakk. Dünyada senin neşenden daha güzel hiçbir manzara yok sevgilim.",
            modun: "Dünyanın en güzel gülüşü senin yüzünde ❤️\n\nUnutma ki sen bu dünyadaki en güçlü, en özel ogle değerli kızsın. Canını sıkan ne varsa geçecek, çünkü arkanda her zaman seni çok seven, seninle gurur duyan ve her düştüğünde seni sımsıkı tutacak bir sevgilin var. Başını dik tut sol yanım.",
            uyku: "Tanışmamız kader, her anımız bir mucize, her saniyemiz aşk 🌹\n\nUykun gelmediyse şimdi gözlerini kapat ve yanındaymışım gibi hayal et. Saçlarınla oynadığımı, seni kollarımın arasına alıp kokunu içime çektiğimi düşün... baktın kii uyuyamıyorsun ne olursa olsun beni aramazsan küseriz kii .Kalbim tamamen seninle dolu.Tatlı rüyalar sarı kedim, rüyanda bizi gör.",
            buyukSurpriz: "Elif'im, dünyalar güzelim...\n\nBu kutuyu açtığına göre bana olan aşkımın büyüklüğünü bir kez daha derinden hissetmek istedin. İyi ki de açmışsın.\n\nHayatıma girdiğin o ilk günden beri dünyamı tamamen değiştirdin. Seninle geçen her gün, her saniye ömrümün en değerli anları oldu. Gülüşün içimi ısıtan tek sığınak, gözlerinse kaybolmaktan asla korkmadığım tek evren.\n\nBu sidedeki her bir fotoğraf, her bir küçük peçete detayı bile senin benim için ne kadar eşsiz olduğunun küçük birer kanıtı. Biz seninle bir olduk, eksik parçalarımızı birbirimizde tamamladık.\n\nSonsuza kadar sadece sen ve ben... Her anımız bir mucize, her saniyemiz aşk olmaya devam edecek. Seni kelimelerin anlatamayacağı kadar çok seviyorum sarı kedim, iyi ki benimsin... ❤️"
        };

        let suankiIndex = 0;
        const toplamResim = 48;
        const baslangicTarihi = new Date("2026-03-28T00:00:00"); 

        function kontrolEt() {
            if (document.getElementById("sifre").value === "887529") {
                document.getElementById("login-ekrani").style.display = "none";
                document.getElementById("site-icerigi").style.display = "block";
                document.getElementById("music-btn").style.display = "block";
                
                setInterval(kalpYarat, 300);
                document.getElementById("audio").play();
                setInterval(sayacGuncelle, 1000);
                sayacGuncelle();

                const galeri = document.getElementById("galeri-alani");
                for (let i = 1; i <= toplamResim; i++) {
                    galeri.innerHTML += `<img src="image_${i}.jpeg" onerror="this.onerror=null; this.src='image_${i}.jpg';" onclick="ac(${i})">`;
                }
            } else {
                alert("Şifre yanlış aşkım Bir daha dene ipucuu telefon şifren...");
            }
        }

        function sayacGuncelle() {
            const simdi = new Date();
            const fark = simdi - baslangicTarihi;
            const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
            const saat = Math.floor((fark % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const dakika = Math.floor((fark % (1000 * 60 * 60)) / (1000 * 60));
            const saniye = Math.floor((fark % (1000 * 60)) / 1000);

            document.getElementById("sayac-gun").innerText = gun;
            document.getElementById("sayac-saat").innerText = saat;
            document.getElementById("sayac-dakika").innerText = dakika;
            document.getElementById("sayac-saniye").innerText = saniye;
        }

        function sevgimetreHesapla() {
            const btn = document.getElementById("sevgimetre-btn");
            const sonucDiv = document.getElementById("sevgimetre-sonuc");
            const yuzdeAlan = document.getElementById("sevgimetre-yuzde");
            const mesajAlan = document.getElementById("sevgimetre-mesaj");
            
            btn.style.display = "none";
            sonucDiv.style.display = "block";
            mesajAlan.style.opacity = "0";
            mesajAlan.innerText = "";
            
            let suankiYuzde = 0;
            const hedef = 100;
            
            const interval = setInterval(() => {
                if (suankiYuzde < hedef) {
                    suankiYuzde++;
                    yuzdeAlan.innerText = "%" + suankiYuzde;
                } else {
                    clearInterval(interval);
                    mesajAlan.innerText = "Her şeyi sorgula, sana olan sevgimii sorgulama... 🤍";
                    mesajAlan.style.opacity = "1";
                }
            }, 20);
        }

        let mektupInterval;

        function mektupYazdir(tip) {
            document.getElementById("mektup-overlay").style.display = "flex";
            const alan = document.getElementById("mektup-metni");
            alan.innerText = "";
            let index = 0;
            const secilenMetin = mektupMetinleri[tip];
            
            clearInterval(mektupInterval);
            mektupInterval = setInterval(() => {
                if (index < secilenMetin.length) {
                    alan.innerText += secilenMetin.charAt(index);
                    index++;
                    document.querySelector('.mektup-zarf').scrollTop = document.querySelector('.mektup-zarf').scrollHeight;
                } else {
                    clearInterval(mektupInterval);
                }
            }, 45);
        }

        function mektupKapat() {
            clearInterval(mektupInterval);
            document.getElementById("mektup-overlay").style.display = "none";
        }

        function kalpYarat() {
            const el = document.createElement('div');
            el.className = 'kalp';
            el.innerText = Math.random() > 0.5 ? '❤️' : '🤍';
            el.style.left = (Math.random() * 100) + '%';
            el.style.animationDuration = (Math.random() * 4 + 3) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 7000);
        }

        function ac(i) { 
            suankiIndex = i; 
            guncelle(); 
            document.getElementById("lightbox").style.display = "flex"; 
        }

        function kapat() { 
            document.getElementById("lightbox").style.display = "none"; 
        }

        function degis(y) { 
            suankiIndex += y; 
            if(suankiIndex < 1) suankiIndex = toplamResim; 
            if(suankiIndex > toplamResim) suankiIndex = 1; 
            guncelle(); 
        }
        
        function guncelle() {
            document.getElementById("buyuk-resim").src = `image_${suankiIndex}.jpeg`;
            document.getElementById("buyuk-resim").onerror = function() { this.src = `image_${suankiIndex}.jpg`; };
            document.getElementById("foto-notu").innerText = notlar[suankiIndex - 1];
        }

        function muzikCal() { 
            document.getElementById("audio").paused ? document.getElementById("audio").play() : document.getElementById("audio").pause(); 
        }

        /* FARE TAKİP EFETKİ: Kalplerin dökülme kodu */
        window.addEventListener('mousemove', function(e) {
            if (Math.random() > 0.15) return; 

            const iz = document.createElement('div');
            iz.className = 'cursor-iz';
            iz.innerText = Math.random() > 0.5 ? '❤️' : '🤍';
            iz.style.left = e.clientX + 'px';
            iz.style.top = e.clientY + 'px';
            
            const boyut = Math.random() * 10 + 10;
            iz.style.fontSize = boyut + 'px';
            
            document.body.appendChild(iz);
            
            setTimeout(() => {
                iz.remove();
            }, 1000);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") degis(-1);
            if (e.key === "ArrowRight") degis(1);
            if (e.key === "Escape") { kapat(); mektupKapat(); }
        });
    </script>
</body>
</html>
